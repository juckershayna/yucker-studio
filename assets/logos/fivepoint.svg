<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" fill="none">
  <!-- Large partial circle arc, gap at upper-right ~80° -->
  <!-- Center (100,130), radius 105 -->
  <!-- Start (at ~-38° from horizontal): (100+105*cos(-38°)=183, 130+105*sin(-38°)=65) -->
  <!-- End (at  38°): (183, 195) -->
  <path d="M 183,65 A 105,105 0 1,0 183,195"
    stroke="currentColor" stroke-width="11" stroke-linecap="round"/>
  <!-- FIVE. text filling the right/gap area -->
  <text x="163" y="140"
    font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
    font-size="54" font-weight="900"
    fill="currentColor" letter-spacing="-1">FIVE</text>
  <text x="163" y="192"
    font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
    font-size="54" font-weight="900"
    fill="currentColor">.</text>
</svg>
