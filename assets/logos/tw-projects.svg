<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <!-- Mountain peaks silhouette -->
  <!-- Left peak -->
  <polygon points="20,100 58,38 78,70" fill="currentColor" opacity="0.5"/>
  <!-- Centre peak (tallest) -->
  <polygon points="42,100 80,18 118,100" fill="currentColor"/>
  <!-- Right peak -->
  <polygon points="82,70 102,38 140,100" fill="currentColor" opacity="0.5"/>
  <!-- Horizontal cut line -->
  <line x1="20" y1="78" x2="140" y2="78" stroke="currentColor" stroke-width="2" opacity="0.6"/>
  <!-- TW text -->
  <text x="80" y="124"
    font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
    font-size="22" font-weight="700" letter-spacing="2"
    fill="currentColor" text-anchor="middle">TW</text>
  <!-- Projects label -->
  <text x="80" y="146"
    font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
    font-size="11" font-weight="400" letter-spacing="3"
    fill="currentColor" text-anchor="middle">Projects</text>
</svg>
