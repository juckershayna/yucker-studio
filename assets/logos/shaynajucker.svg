<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" fill="none">
  <!-- Stylised "s" loop at top -->
  <path d="M 85,18 C 95,10 110,12 110,26 C 110,40 88,42 82,54 C 76,66 90,72 100,68"
    stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Long sweeping "j" descender -->
  <path d="M 100,18 C 100,18 100,160 90,190 C 82,212 62,218 52,208"
    stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- dot of j -->
  <circle cx="100" cy="8" r="4" fill="currentColor"/>
  <!-- "shay jucker" label text -->
  <text x="80" y="135"
    font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
    font-size="11" font-weight="300" letter-spacing="4"
    fill="currentColor" text-anchor="middle">shay</text>
  <text x="80" y="150"
    font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
    font-size="11" font-weight="300" letter-spacing="4"
    fill="currentColor" text-anchor="middle">Jucker</text>
</svg>
